# Yarn 4.18.1 + Windows: builtin TS compat patch fails under node-modules (YN0012).
# pnpm linker still materializes node_modules and links native pkgs (sharp) more reliably.
nodeLinker: pnpm

yarnPath: .yarn/releases/yarn-4.18.1.cjs

enableGlobalCache: false

# Uncompressed cache avoids flaky native DLL extract (sharp/libvips) on Windows
compressionLevel: 0

tsEnableAutoTypes: false

# Host + Linux (Docker build images)
supportedArchitectures:
  os:
    - current
    - linux
  cpu:
    - current
    - x64
    - arm64
  libc:
    - current
    - glibc
