# Sadece altyapı (API/Web host'ta lokal çalışır)
name: protocol-z-dev

services:
  postgres:
    image: postgres:18-alpine
    environment:
      POSTGRES_USER: protocolz
      POSTGRES_PASSWORD: protocolz
      POSTGRES_DB: protocolz
    ports:
      - '5432:5432'
    volumes:
      # PG18+: mount parent dir (PGDATA=/var/lib/postgresql/18/docker)
      - pz_pg_dev:/var/lib/postgresql
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U protocolz -d protocolz']
      interval: 5s
      timeout: 5s
      retries: 12

  pgbouncer:
    image: edoburu/pgbouncer:v1.23.1-p1
    environment:
      DATABASE_URL: postgres://protocolz:protocolz@postgres:5432/protocolz
      POOL_MODE: transaction
      MAX_CLIENT_CONN: 200
      DEFAULT_POOL_SIZE: 20
      AUTH_TYPE: scram-sha-256
      LISTEN_PORT: 5432
    ports:
      - '6432:5432'
    depends_on:
      postgres:
        condition: service_healthy

  redis:
    image: redis:7-alpine
    ports:
      - '6379:6379'
    command: ['redis-server', '--appendonly', 'yes']
    volumes:
      - pz_redis_dev:/data
    healthcheck:
      test: ['CMD', 'redis-cli', 'ping']
      interval: 5s
      timeout: 3s
      retries: 12

volumes:
  pz_pg_dev:
  pz_redis_dev:
