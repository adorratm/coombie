name: Image

# Builds the single-container game image (infra/Dockerfile.coombie) and pushes it to
# ghcr.io/<owner>/coombie. Dracord's "Deploy COOMBIE" workflow pulls :latest onto the
# server and restarts the game when the digest changes (see docs/deploy.md).

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: image-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  packages: write

jobs:
  build:
    name: Build + push game image
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build + push
        uses: docker/build-push-action@v6
        with:
          context: .
          file: infra/Dockerfile.coombie
          push: true
          tags: |
            ghcr.io/${{ github.repository_owner }}/coombie:${{ github.sha }}
            ghcr.io/${{ github.repository_owner }}/coombie:latest
          cache-from: type=gha,scope=coombie
          cache-to: type=gha,mode=max,scope=coombie
          provenance: false

      - name: Smoke the image
        run: |
          set -euo pipefail
          img="ghcr.io/${{ github.repository_owner }}/coombie:${{ github.sha }}"
          docker run -d --name smoke -p 3001:3001 "$img"
          for i in $(seq 1 30); do
            if curl -fsS http://127.0.0.1:3001/health >/dev/null 2>&1; then break; fi
            sleep 1
          done
          curl -fsS -o /dev/null -w "health %{http_code}\n" http://127.0.0.1:3001/health
          curl -fsS http://127.0.0.1:3001/ | grep -qi '<div id="lobby"' && echo "game index OK"
          curl -fsS -o /dev/null -w "landing %{http_code}\n" http://127.0.0.1:3001/tanitim/
          docker logs smoke 2>&1 | tail -20
