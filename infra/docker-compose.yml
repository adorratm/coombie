name: protocol-z

services:
  postgres:
    image: postgres:18-alpine
    environment:
      POSTGRES_USER: protocolz
      POSTGRES_PASSWORD: protocolz
      POSTGRES_DB: protocolz
    ports:
      - '5432:5432'
    volumes:
      # PG18+: mount parent dir (PGDATA=/var/lib/postgresql/18/docker)
      - pz_pg:/var/lib/postgresql
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U protocolz -d protocolz']
      interval: 5s
      timeout: 5s
      retries: 12
    networks:
      - pz_net

  pgbouncer:
    image: edoburu/pgbouncer:v1.23.1-p1
    environment:
      DATABASE_URL: postgres://protocolz:protocolz@postgres:5432/protocolz
      POOL_MODE: session
      MAX_CLIENT_CONN: 200
      DEFAULT_POOL_SIZE: 20
      AUTH_TYPE: plain
      LISTEN_PORT: 5432
    ports:
      - '6432:5432'
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - pz_net

  redis:
    image: redis:7-alpine
    ports:
      - '6379:6379'
    command: ['redis-server', '--appendonly', 'yes']
    volumes:
      - pz_redis:/data
    healthcheck:
      test: ['CMD', 'redis-cli', 'ping']
      interval: 5s
      timeout: 3s
      retries: 12
    networks:
      - pz_net

  api:
    build:
      context: ..
      dockerfile: infra/Dockerfile.api
    environment:
      NODE_ENV: production
      PORT: 3001
      CORS_ORIGIN: http://localhost:3000
      DATABASE_HOST: postgres
      DATABASE_PORT: 5432
      DATABASE_USER: protocolz
      DATABASE_PASSWORD: protocolz
      DATABASE_NAME: protocolz
      REDIS_URL: redis://redis:6379
      TYPEORM_SYNC: 'true'
    ports:
      - '3001:3001'
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - pz_net

  web:
    build:
      context: ..
      dockerfile: infra/Dockerfile.web
    environment:
      NODE_ENV: production
      PORT: 3000
      NEXT_PUBLIC_API_URL: http://localhost:3001
      NEXT_PUBLIC_WS_URL: http://localhost:3001
    ports:
      - '3000:3000'
    depends_on:
      - api
    networks:
      - pz_net

volumes:
  pz_pg:
  pz_redis:

networks:
  pz_net:
    driver: bridge
